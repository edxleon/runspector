# The workflow pins its actions to commit SHAs, which is only as good as the
# habit of moving them: the first three pins aged into a Node 20 deprecation
# notice within a week, and nothing said so. Dependabot files the PR; CI on the
# PR is the check that the new SHA still does what the old one did.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Keeps the `# vX.Y.Z` comment next to the SHA up to date, so the pin stays
    # readable by a human.
    commit-message:
      prefix: "ci"
    # One PR a week for all of them: one PR per action and package had seven
    # piled up at once, every one green and none merged.
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # `garminconnect` tracks an unofficial API; a minor bump there is exactly
    # the change that needs a human to run `runspector sync` once before merging.
    commit-message:
      prefix: "deps"
    # The tools and the small pins together; the two that change behaviour
    # stay single, each a decision of its own (see the comments around them).
    groups:
      tools-and-pins:
        patterns: ["*"]
        exclude-patterns: ["garminconnect", "mcp"]
    ignore:
      # `pyproject.toml` pins `mcp<2` on purpose: 2.x renamed FastMCP and
      # changed the server API. Dependabot's very first PR proposed 2.2.0
      # anyway and CI rejected it; a major bump there is a port, not a bump.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
