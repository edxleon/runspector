name: ci

on:
  push:
    branches: [main]
  pull_request:

# One matrix per branch. Pushing twice in a minute otherwise leaves the first
# six legs running against a commit nobody is waiting for any more. A push to
# `main` is not cancelled: its result is the badge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: nothing in this workflow writes to the repo, packages or
# releases. Job-level grants stay opt-in from here.
permissions:
  contents: read

jobs:
  test:
    # The slowest leg (Windows) took three to four minutes once, 10 to 14 in
    # October 2026 and 15 to 23 by November; at fifteen, two Windows legs were
    # cancelled at exactly 15:00, at twenty-five one at 25:11 - nothing failing
    # either time. Thirty-five is headroom for a slow runner and still catches
    # a hang early. Without it the default is six HOURS per leg — and this
    # suite has already had one: headless Chrome on the macOS runners never
    # returns, it only ever hit a timeout inside the test.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # `requires-python = ">=3.12"` is a promise about every version above it;
        # one unpinned interpreter per OS tested none of them in particular.
        python: ["3.12", "3.13"]
        # Coverage is measured on ONE leg: the number is the same code on every
        # OS, but a floor checked six times fails on whichever leg skips the most
        # platform branches. 93 % at the time the floor was set (v0.4.1); the
        # floor only stops it from eroding unnoticed.
        include:
          - os: ubuntu-latest
            python: "3.12"
            coverage: coverage   # the value lands in the check's name: keep it short
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag is mutable, and these
      # three run with access to the workflow token before any test does.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; no token left in .git/config
          # The coverage leg compares with the base commit (tamper report below).
          fetch-depth: ${{ matrix.coverage && '0' || '1' }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          # Keyed on uv.lock, so the cache is only reused for the exact
          # dependency set it was built from.
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The matrix is only real if the interpreter actually changes with it.
      # `.python-version` pins the local dev interpreter and could quietly win
      # over the matrix, which would leave one leg testing the other's version
      # and the README claiming two. So every `uv run` names the version, and
      # this step fails the job if what arrives is not what was asked for.
      - name: The interpreter is the one this leg is for
        run: |
          uv run --python ${{ matrix.python }} python -c "import sys; got = '%d.%d' % sys.version_info[:2]; want = '${{ matrix.python }}'; print('running', got); raise SystemExit(0 if got == want else f'expected {want}, got {got}')"

      - name: Lint
        run: uv run --python ${{ matrix.python }} ruff check
      - name: Python tests (no database server, no network, no Garmin account)
        shell: bash   # one syntax for the empty $COVERAGE on every leg, Windows included
        env:
          COVERAGE: ${{ matrix.coverage && '--cov=runspector --cov-branch --cov-report=term:skip-covered --cov-fail-under=92' || '' }}
          # Outside the tree: the data file holds absolute paths, and pii_gate
          # (two steps down) reads every file in the checkout.
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: uv run --python ${{ matrix.python }} pytest -q $COVERAGE
      - name: Frontend logic tests
        run: node --test "web-tests/*.test.mjs"
      - name: Eval suite is well-formed (dry run, no model calls)
        run: uv run --python ${{ matrix.python }} python evals/run_evals.py --dry-run
      - name: Nothing personal in the tree
        run: uv run --python ${{ matrix.python }} python scripts/pii_gate.py
      # What the change does to the tests themselves (scripts/tamper_report.py):
      # tests deleted, skips added, the coverage floor moved, golden files
      # rewritten, eval cases dropped - listed in the summary for the review.
      # Red only on a lower floor or a lost safety case. On the coverage leg,
      # because that leg is a required check: a separate job would not stop a merge.
      # The base commit's copy of the script runs when there is one, so a change
      # does not edit the check that reports on it; `-P` keeps a module the
      # change adds next to it from being imported instead of the real one. When
      # that copy ends in an error (exit 2 and up: an option it does not know, a
      # crash the change fixes), the change's own copy runs. Also after a red step.
      - name: What this change does to the tests
        if: ${{ !cancelled() && matrix.coverage }}
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          check() { uv run --python ${{ matrix.python }} python -P "$1" --base "$BASE"; }
          if git cat-file -e "$BASE:scripts/tamper_report.py" 2>/dev/null; then
            git show "$BASE:scripts/tamper_report.py" > scripts/.tamper_report_base.py
            rc=0; check scripts/.tamper_report_base.py || rc=$?
            if [ "$rc" -le 1 ]; then exit "$rc"; fi
            echo "::notice::the base commit's copy of the check ended with $rc - running this change's copy"
          fi
          check scripts/tamper_report.py

  # The shipped frontend has no build step, so nothing reads it before a
  # browser does. Biome lints it (rules and the reasons for the ones switched
  # off: biome.jsonc). Once, not per leg: the result cannot depend on the OS.
  frontend:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; no token left in .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false   # no package.json, nothing to cache
      - name: Biome
        run: npx --yes @biomejs/biome@2.5.15 lint --error-on-warnings

  # The suite above proves the code from inside the checkout. This job proves
  # the PACKAGE from outside it: build the wheel, `uv tool install` it into a
  # throw-away tool dir the way a user would, and drive the installed
  # executable through the README's quick start - demo over HTTP, doctor,
  # sync, login without a terminal, the MCP handshake. It is the "other
  # computer" the author does not have: a machine that has never seen the
  # source tree. Standard-library Python drives it, so it runs on whatever
  # interpreter the runner has, and the installed tool brings its own.
  install:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; no token left in .git/config
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the wheel as a user and use it as one
        run: uv run --no-project python scripts/install_check.py

  # The workflows themselves, audited: unpinned actions, template injection,
  # credentials left in the checkout, caches feeding a release. Every workflow
  # here runs with a token, and a Dependabot PR edits them weekly.
  workflows:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; no token left in .git/config
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: zizmor
        run: uvx zizmor@1.31.1 --min-severity medium .github/workflows
