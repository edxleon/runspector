name: release

# A pushed tag `vX.Y.Z` becomes the GitHub release, with the wheel and the
# sdist built HERE and signed with a build-provenance attestation, the same
# files on PyPI, and the MCP registry entry pointing at them. `build` and
# `test` run without rights; `release`, `pypi` and `mcp-registry` hold only the
# rights their own step needs and run no project code. Until now a
# release was four hand steps on one laptop (bump, build, create, upload), and
# nothing checked that the tag, `pyproject.toml` and `__version__` agree - a
# wheel named 0.3.0 on a v0.3.1 release would have passed.
#
#   git tag v0.3.2 && git push origin v0.3.2
#
# The notes come from `docs/releases/<tag>.md` when it exists, else GitHub
# generates them from the commits. A draft that already exists (made by hand)
# keeps its notes and gets the files; a published one must already hold
# exactly these files (see the Release step).

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The suite, with no rights at all. Everything the tests import - this code
  # and every dependency - runs here, so it must not run where the job can
  # mint an OIDC token or write a release.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; no token left in .git/config
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false   # no cache anywhere on the way to a release
      # The Python suite runs the shipped logic.js through node
      # (tests/test_js_python_contract.py): the same node as ci.yml.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: The tag, pyproject.toml, __version__ and server.json name the same version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          uv run --python 3.12 --locked python - <<'EOF'
          import json, os, re, tomllib
          tag = os.environ["TAG"].removeprefix("v")
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          init = re.search(r'__version__ = "([^"]+)"', open("src/runspector/__init__.py").read())[1]
          # The registry entry pins the PyPI version a client installs: a stale
          # one would hand every new user the previous release.
          server = json.load(open("server.json"))
          listed = [server["version"], *(p["version"] for p in server["packages"])]
          print(f"tag {tag}, pyproject {project}, __version__ {init}, server.json {listed}")
          raise SystemExit(0 if {tag, project, init, *listed} == {tag}
                           else "versions disagree - bump all of them, re-tag")
          EOF
      # The matrix in ci.yml ran on this commit when it reached main; this is
      # the short version again, so a tag on a commit that never went through
      # CI (or a red one) cannot become a release.
      - name: Lint and tests
        run: |
          uv run --python 3.12 --locked ruff check
          uv run --python 3.12 --locked pytest -q
          uv run --python 3.12 --locked python scripts/pii_gate.py

  # The package, built with no rights: `uv build` runs the build backend
  # (hatchling, pinned exactly in pyproject.toml) and nothing of this project.
  # Built before anything else touches the tree, and handed on as an artifact.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; no token left in .git/config
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false   # no cache anywhere on the way to a release
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          # Long enough that "Re-run failed jobs" after a PyPI outage still
          # publishes these files, not a rebuild, a day or two later.
          retention-days: 14
          if-no-files-found: error

  # Attest and publish - no Python, no project code, no dependency runs here,
  # only the checkout (for the notes file), GitHub's attest action and `gh`.
  release:
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # create the release, upload its files
      id-token: write        # the attestation's OIDC identity
      attestations: write    # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; no token left in .git/config
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # A draft first, the files second, published last: with immutable
        # releases on (Settings > General > Releases) a published release takes
        # no file, and its tag and files are locked for good.
        run: |
          set -e   # as GitHub runs it; said here so the step reads the same anywhere
          # The release must hold exactly dist/: the same names with the same
          # bytes, nothing missing and nothing more. `held` is read on its own
          # line, so an API error stops the step with its own message instead of
          # reading as "other files".
          built=$(for f in dist/*; do echo "$(basename "$f") sha256:$(sha256sum "$f" | cut -d' ' -f1)"; done | sort)
          held() { gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.digest)"'; }
          # The state from ONE listing of the releases, drafts included: any
          # error stops here. `gh release view` asks for the published release
          # and the draft side by side and says "release not found" when one
          # says so and the other failed - read as "none", a 5xx made a second
          # draft beside the first.
          if ! states=$(gh api "repos/{owner}/{repo}/releases?per_page=100" --paginate \
                          --jq '.[] | select(.tag_name == env.TAG) | .draft'); then
            echo "::error::cannot list the releases"
            exit 1
          fi
          case "$states" in
            "") state=none ;;
            true|false) state=$states ;;
            *) echo "::error::more than one release for $TAG ($(echo $states)) - delete the extra draft"; exit 1 ;;
          esac
          if [ "$state" = "false" ]; then
            # Published already, by an earlier attempt of this run ("Re-run all
            # jobs" after PyPI failed). Its files cannot change any more, so
            # they must be these - and they are, when nothing changed: the build
            # is reproducible (a rebuild of v0.10.0 gave the same bytes).
            have=$(held)
            if [ "$(printf '%s\n' "$have" | sort)" = "$built" ]; then
              echo "$TAG is published with exactly these files"
              exit 0
            fi
            echo "::error::$TAG is published with other files than this build (a rebuild that came out different, or files added by hand). Nothing of this run reached PyPI. If PyPI has $TAG, nothing is missing; if not, release a new version - this tag cannot take other files."
            exit 1
          fi
          if [ "$state" = "none" ]; then
            if [ -f "docs/releases/$TAG.md" ]; then
              gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file "docs/releases/$TAG.md"
            else
              gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes
            fi
          fi
          gh release upload "$TAG" dist/* --clobber
          # A draft made by hand may carry more; what is published is what PyPI gets.
          have=$(held)
          if [ "$(printf '%s\n' "$have" | sort)" != "$built" ]; then
            echo "::error::the draft $TAG holds files that are not this build's - remove them from the draft, then re-run"
            exit 1
          fi
          gh release edit "$TAG" --draft=false

  # Accepted, and the one place it is: gh-action-pypi-publish is pinned to a
  # commit but runs PyPA's Docker image by tag, in a job that can mint an OIDC
  # token - and the MCP registry takes any OIDC token of this owner as a login
  # for io.github.edxleon/*. It is PyPA's own way to PyPI, and the only one
  # that makes PyPI's attestations; nothing optional (scorecard.yml) gets that.
  #
  # PyPI through a trusted publisher: no token exists anywhere, PyPI trusts the
  # OIDC identity of this workflow in the `pypi` environment. Like `release`, it
  # runs no project code and uploads the files `build` made. After `release`, not
  # beside it: a version on PyPI can never be replaced, so it goes out only once
  # the attestation and the GitHub release for exactly these files exist.
  pypi:
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write        # the trusted-publisher identity, nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # The MCP registry entry points at the PyPI package and checks the `mcp-name`
  # line in its README, so it runs after `pypi`. mcp-publisher is a downloaded
  # binary in a job that can mint an OIDC token: pinned to a version and checked
  # against the hash taken when it was pinned, so nothing floats in here.
  mcp-registry:
    needs: [pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write        # the registry's GitHub OIDC login for io.github.edxleon/*
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; no token left in .git/config
      - name: mcp-publisher, verified
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      # PyPI serves a fresh upload's README a little after the upload returns,
      # and the registry reads it from there - so a few tries, not one.
      - name: Publish server.json
        run: |
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5 6; do
            ./mcp-publisher publish && exit 0
            echo "attempt $attempt failed - PyPI may not show the new release yet"
            sleep 30
          done
          exit 1
